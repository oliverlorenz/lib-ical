version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      eslint:
        dev-lint:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@eslint-community/*"
          - "@typescript-eslint/*"
          - "typescript-strict-plugin"
          - "typescript"
          - "@types/*"
          - "prettier"
          - "eslint-config-prettier"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "@jest/*"
          - "ts-jest"
      tooling:
        patterns:
          - "husky"
          - "del-cli"
          - "globals"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      github-actions:
        patterns:
          - "*"
